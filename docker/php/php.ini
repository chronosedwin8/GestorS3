; Los archivos van directo del navegador a S3: PHP no necesita aceptar subidas grandes.
upload_max_filesize = 10M
post_max_size = 10M
memory_limit = 256M
max_execution_time = 60
; La descarga ZIP amplía su propio límite (set_time_limit(0)).

; Streaming del ZIP sin búferes intermedios.
output_buffering = Off
zlib.output_compression = Off

expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

date.timezone = UTC
default_charset = "UTF-8"

session.use_strict_mode = 1
session.cookie_httponly = 1
session.use_only_cookies = 1

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
